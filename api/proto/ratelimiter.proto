syntax = "proto3";

package ratelimiter;

option go_package = "github.com/Zartex-the-art/sei-ratelimiter/api/proto";

service RateLimiter {
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  string client_id = 1;
  string algorithm = 2;
  int32 limit = 3;
  int32 window_secs = 4;
}

message CheckResponse {
  bool allowed = 1;
  int32 remaining = 2;
  string algorithm = 3;
  string client_id = 4;
  string rule_id = 5;
  string error = 6;
}