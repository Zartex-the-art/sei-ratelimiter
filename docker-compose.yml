services:

  app1:
    restart: unless-stopped
    build: .
    container_name: app1
    environment:
      PORT: 8080
      NODE_ID: node-1
      REDIS_URL: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - redis

  app2:
    restart: unless-stopped
    build: .
    container_name: app2
    environment:
      PORT: 8080
      NODE_ID: node-2
      REDIS_URL: redis:6379
    ports:
      - "8081:8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  redis_data:
